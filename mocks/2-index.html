<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects · Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root {
  --ink: #f2f3f7; --dim: #9aa0b4; --faint: #555b70; --rule: rgba(255,255,255,.12);
  --display: "Big Shoulders Display", Impact, sans-serif;
  --ui: "Atkinson Hyperlegible", ui-sans-serif, system-ui, sans-serif;
  --gutter: clamp(16px, 3vw, 48px);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: #05060a; color: var(--ink); font: 15px/1.45 var(--ui); }
a { color: inherit; text-decoration: none; }
.bg { position: fixed; inset: 0; z-index: 0; }
.bg-frame { width: 100%; height: 100%; border: 0; }
.scrim { position: fixed; inset: 0; z-index: 1; background: rgba(5,6,10,.74); pointer-events: none; }
.page { position: relative; z-index: 2; padding: 0 var(--gutter); }

header { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 24px; padding: 28px 0 18px; border-bottom: 2px solid var(--ink); }
.name { font-family: var(--display); font-weight: 500; font-size: 20px; color: var(--dim); }
.name a:hover { color: var(--ink); }
.q { display: block; width: 100%; margin-top: 6px; font: 900 clamp(48px, 8vw, 120px)/.9 var(--display); color: var(--ink);
  background: none; border: 0; padding: 0; letter-spacing: -0.01em; text-transform: uppercase; }
.q::placeholder { color: var(--ink); opacity: 1; }
.q:focus { outline: none; }
.q:focus::placeholder { color: var(--faint); }
.bgnote { text-align: right; color: var(--dim); font-size: 13px; }
.bgnote button { font: 700 13px var(--ui); color: var(--ink); background: none; border: 1px solid var(--rule); border-radius: 4px; padding: 4px 10px; margin-top: 6px; cursor: pointer; }

.cloud { padding: 16px 0 22px; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.25; text-transform: uppercase; border-bottom: 1px solid var(--rule); }
.cloud button { font: inherit; color: var(--faint); background: none; border: 0; padding: 0 12px 0 0; cursor: pointer; text-transform: inherit; }
.cloud button sup { font: 400 11px var(--ui); margin-left: 2px; vertical-align: 10px; }
.cloud button:hover { color: var(--dim); }
.cloud button.on { color: var(--c, var(--ink)); }

.row { display: grid; grid-template-columns: 64px 1fr minmax(0, 340px); align-items: center; gap: 20px;
  padding: 8px 0; border-bottom: 1px solid var(--rule); position: relative; }
.row .y { font-family: var(--ui); color: var(--faint); font-size: 13px; }
.row .t { font: 800 clamp(34px, 4.4vw, 64px)/1 var(--display); text-transform: uppercase; letter-spacing: 0; transition: color .15s, transform .2s; }
.row .tg { color: var(--dim); font-size: 13px; text-align: right; }
.row .tg b { color: var(--c); font-weight: 700; }
.row:hover .t { color: var(--c); transform: translateX(10px); }
.row.feat .t::after { content: ""; display: inline-block; width: .32em; height: .32em; border-radius: 50%; background: var(--c); margin-left: .25em; vertical-align: .55em; }
.row .mini { display: none; }

/* desktop: the screenshot follows the cursor */
.peek { position: fixed; z-index: 10; width: 340px; aspect-ratio: 4/3; pointer-events: none; opacity: 0; transition: opacity .12s;
  border-radius: 6px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.peek img { width: 100%; height: 100%; object-fit: cover; display: block; }
.peek .desc { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 14px 12px; font-size: 14px;
  background: linear-gradient(transparent, rgba(0,0,0,.85)); }
.peek.noimg { background: #12141c; aspect-ratio: auto; }
.peek.noimg .desc { position: static; background: none; padding: 16px; }

.m-footer { text-align: center; color: var(--dim); font-size: 13px; padding: 48px 0; }
.m-footer a { color: #ffd166; }

@media (max-width: 720px) {
  header { grid-template-columns: 1fr; padding-top: 18px; }
  .bgnote { text-align: left; display: flex; gap: 10px; align-items: center; }
  .bgnote button { margin: 0; }
  .cloud { font-size: 18px; white-space: nowrap; overflow-x: auto; scrollbar-width: none; }
  .row { grid-template-columns: 1fr 64px; gap: 12px; padding: 10px 0; }
  .row .y { display: none; }
  .row .t { font-size: 30px; }
  .row .tg { grid-column: 1; grid-row: 2; text-align: left; margin-top: -6px; }
  .row .mini { display: block; grid-column: 2; grid-row: 1 / span 2; width: 64px; height: 64px; border-radius: 4px; object-fit: cover; background: #151824; }
  .peek { display: none; }
}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="scrim"></div>
<div class="page">
  <header>
    <div>
      <div class="name"><a href="#">Mike Delmonaco</a></div>
      <input class="q" id="q" type="search" placeholder="136 projects" aria-label="Search projects">
    </div>
    <div class="bgnote"><div>Behind this: <b id="bgname"></b></div><button id="shuffle">Another one</button></div>
  </header>
  <nav class="cloud" id="cloud"></nav>
  <div id="list"></div>
  <div id="foot"></div>
</div>
<div class="peek" id="peek"></div>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
// home page's five section colors, reused as tag inks
const INKS = ['#8b99ff', '#5fcfa6', '#f2a65a', '#e8cf5c', '#ee90ba', '#7fd4ea'];
const ink = t => INKS[M.hash(t) % INKS.length];
const bg = M.background(document.getElementById('bg'), 1);
const nm = document.getElementById('bgname'); nm.textContent = bg.name(); bg.onchange = n => (nm.textContent = n);
document.getElementById('shuffle').onclick = () => bg.shuffle();
document.getElementById('foot').innerHTML = M.footer;

let tag = 'all';
const cloud = document.getElementById('cloud');
let showAll = false;
function drawCloud() {
  const ts = ['all', 'featured', ...(showAll ? M.browseTags : M.browseTags.slice(0, 14))];
  cloud.innerHTML = ts.map(t =>
    `<button data-t="${t}" style="--c:${t === 'all' || t === 'featured' ? '#f2f3f7' : ink(t)}">${t === 'all' ? 'Everything' : t}<sup>${t === 'all' ? M.P.length : t === 'featured' ? M.featured.length : M.tagCounts[t]}</sup></button>`).join('')
    + (showAll ? '' : `<button data-more>+${M.browseTags.length - 14} more</button>`);
}
drawCloud();
cloud.onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.more !== undefined) { showAll = true; drawCloud(); } else tag = b.dataset.t; render(); };
const q = document.getElementById('q'); q.oninput = render;

function render() {
  cloud.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === tag));
  const list = M.filter(q.value.trim(), tag);
  list.sort((a, b) => (b.f - a.f) || b.date.localeCompare(a.date));
  q.placeholder = `${list.length} projects`;
  document.getElementById('list').innerHTML = list.map((p, i) => {
    const main = p.tags.find(t => t !== 'web' && t !== 'mobile-friendly') || 'web';
    const tags = p.tags.filter(t => t !== 'web' && t !== 'mobile-friendly').slice(0, 3);
    return `<a class="row${p.f ? ' feat' : ''}" href="${p.link}" data-i="${M.P.indexOf(p)}" style="--c:${ink(main)}">
      <span class="y">${M.year(p)}</span><span class="t">${M.esc(p.t)}</span>
      <span class="tg">${tags.map((t, j) => j === 0 ? `<b>${t}</b>` : t).join(' / ')}</span>
      ${p.img ? `<img class="mini" loading="lazy" src="${p.img}" alt="">` : '<span class="mini"></span>'}</a>`;
  }).join('');
}
render();

const peek = document.getElementById('peek');
document.getElementById('list').addEventListener('pointermove', e => {
  const r = e.target.closest('.row');
  if (!r) { peek.style.opacity = 0; return; }
  const p = M.P[r.dataset.i];
  if (peek.dataset.i !== r.dataset.i) {
    peek.dataset.i = r.dataset.i;
    peek.className = 'peek' + (p.img ? '' : ' noimg');
    peek.innerHTML = (p.img ? `<img src="${p.img}" alt="">` : '') + `<div class="desc">${M.esc(p.d)}</div>`;
  }
  peek.style.opacity = 1;
  peek.style.left = Math.min(e.clientX + 24, innerWidth - 360) + 'px';
  peek.style.top = Math.min(e.clientY - 120, innerHeight - 280) + 'px';
});
document.getElementById('list').addEventListener('pointerleave', () => (peek.style.opacity = 0));
</script>
</body>
</html>
